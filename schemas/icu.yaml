---
skeleton:
  type: object
  title: skeleton
  properties:
    locale_code:
      type: string
      description: "Object keys are dynamic and based on requested locale codes, see example."
  example:
    en: "{number, plural, one {} other {}}"
    de: "{number, plural, one {} other {}}"

skeleton_cldr_version:
  type: string
  description: >-
    Pluralization rule set to use when constructing skeletons. Pass `legacy`
    for pre-CLDR behaviour, or a CLDR version string such as `cldr48`.
    Defaults to the project's configured version when omitted.
  example: cldr48
